<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=flight" />
    <link rel="stylesheet" href="style.css">
    <title>Arat-Na-Travels</title>
</head>
<body>
    <div class="header">
        
        <span class="material-symbols-outlined">flight</span>
        <h2>Arat Na Travel</h2>

        <div class="right-header">
            <button class="btn">Home</button>
            <h3>Features</h3>
            <h3>Pricing</h3>
            <h3>FAQs</h3>
            <h3>About</h3>
        </div>
    </div>

    <div class="card-form"> 
        <img src="images/image3.jpeg" alt="travel">

        <form action="" method="post">
            <h1>Create Account</h1>
            <label for="first">Firstname:</label><br>
            <input type="text" id="first" name="first" required><br><br>

            <label for="lastname">Lastname:</label><br>
            <input type="text" id="lastname" name="lastname" required><br><br>
            
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required><br><br>

            <label for="city">city</label>            
            <label for="state">state</label>
            <label for="city">zip</label><br>

            
            <input type="city" class="size" id="city" name="city" required>
            <select id="state" name="state">
                <option>i Love  YOu</option>
                <option>Im inlove</option>
            </select>

            <input type="text" class="size" id="zip" name="zip" required><br><br>

            <input type="submit" value="Submit">
        </form>

    </div>

</body>
</html>
